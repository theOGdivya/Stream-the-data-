# Production stack for the Hostinger VPS. See docs/deploy.md.
#   cp .env.example .env   (fill it in)
#   docker compose up -d --build
name: aq-platform

x-app: &app
  build: ../server
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://aq:${POSTGRES_PASSWORD}@db:5432/aq
    DATA_DIR: /data
  volumes:
    - frames:/data   # every stored camera picture lives here
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aq
      POSTGRES_USER: aq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aq -d aq"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    <<: *app
    depends_on:
      db: { condition: service_healthy }

  worker:
    <<: *app
    command: ["python", "-m", "aqserver.worker"]
    healthcheck: { disable: true }
    depends_on:
      api: { condition: service_healthy }   # the API creates the tables first

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]

volumes:
  pgdata:
  frames:
  caddy_data:
  caddy_config:
