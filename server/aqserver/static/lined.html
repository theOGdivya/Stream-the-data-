<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lined up</title>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/lined.js"></script>
</head>
<body>
  <main>
    <section class="panel">
      <div class="panel-head">
        <h1>Lined up</h1>
        <div class="seg" role="group" aria-label="Mode">
          <button type="button" data-mode="live" aria-pressed="true">Live</button>
          <button type="button" data-mode="time" aria-pressed="false">Go back in time</button>
        </div>
        <span class="small muted" id="when"></span>
        <div class="spacer"></div>
        <a class="btn" id="download" href="/api/strip.png" target="_blank" rel="noopener">Download as image</a>
      </div>
      <p class="small muted" style="margin:0">Every marked monitor's screen, straightened and side by side, from the same moment, with the values read from it.</p>
      <div id="time-controls" class="hidden" style="margin-top:12px;display:grid;gap:10px">
        <div class="row">
          <label class="row small">Period <select id="period"></select></label>
          <button type="button" id="prev" aria-label="Previous picture">◀</button>
          <button type="button" class="primary" id="play">▶ Play</button>
          <button type="button" id="next" aria-label="Next picture">▶</button>
          <label class="row small">Speed
            <select id="speed">
              <option value="1">1 picture / s</option>
              <option value="3" selected>3 pictures / s</option>
              <option value="8">8 pictures / s</option>
            </select>
          </label>
          <span class="small muted" id="pos"></span>
        </div>
        <input type="range" id="slider" min="0" max="0" value="0" aria-label="Time" style="width:100%">
      </div>
    </section>
    <section class="lineup" id="tiles" aria-live="polite"></section>
  </main>
</body>
</html>
