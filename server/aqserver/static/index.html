<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live monitor</title>
  <link rel="stylesheet" href="vendor/uplot-1.6.31.min.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="vendor/uplot-1.6.31.min.js"></script>
  <script type="module" src="js/live.js"></script>
</head>
<body>
  <main>
    <header class="page-head">
      <h1>Live</h1>
      <p class="page-intro">What is being recorded right now: cameras, the latest number on every monitor, and the readings over time. Updates by itself.</p>
    </header>
    <section class="strip" id="strip" aria-label="Status"></section>
    <section class="panel onboard hidden" id="onboard" aria-label="Getting started"></section>
    <section class="alerts" id="alerts" aria-live="polite"></section>
    <section class="cams" id="cams" aria-label="Cameras">
      <div class="panel empty-state" id="no-cams"><strong>No cameras yet</strong>
        <span>Choose which webcam to record on the <a href="cameras.html">Cameras page</a>, or open the recorder in a browser.</span></div>
    </section>
    <section class="panel" aria-labelledby="chart-title">
      <div class="panel-head">
        <h2 id="chart-title">Readings over time</h2>
        <div class="seg" id="metric-seg" role="group" aria-label="Metric"></div>
        <div class="spacer"></div>
        <div class="seg" id="range-seg" role="group" aria-label="Time range"></div>
      </div>
      <div class="row small muted" style="margin-bottom:8px">
        <label class="row"><input type="checkbox" id="include-review"> Include readings not yet reviewed</label>
        <label class="row"><input type="checkbox" id="table-mode"> Show as table</label>
      </div>
      <div class="events-bar">
        <span class="small muted">Mark what happens now:</span>
        <span class="row" id="event-presets"></span>
        <button type="button" id="event-open">Other / earlier…</button>
      </div>
      <form id="event-form" class="event-form hidden" aria-label="Mark an event">
        <div class="form-grid">
          <label class="field">What happened <input name="label" maxlength="128" required placeholder="e.g. Incense lit near monitor 2"></label>
          <label class="field">When <input type="datetime-local" name="at" step="1" required></label>
          <label class="field">Until (optional, if it lasted) <input type="datetime-local" name="until" step="1"></label>
          <label class="field">Notes (optional) <input name="notes" maxlength="2000"></label>
        </div>
        <div class="row"><button type="submit" class="primary">Save event</button><button type="button" id="event-cancel">Cancel</button></div>
      </form>
      <div id="chart"></div>
      <p class="muted small" id="chart-note"></p>
      <div id="event-list" class="event-list"></div>
    </section>
  </main>

  <dialog id="zoom">
    <div class="dialog-head">
      <h2 id="zoom-title">Camera</h2>
      <span id="zoom-badge" class="pill">…</span>
      <button type="button" id="zoom-close">Close</button>
    </div>
    <div class="dialog-body"><img id="zoom-img" alt="Live camera view"></div>
  </dialog>
</body>
</html>
